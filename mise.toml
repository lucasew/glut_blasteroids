[tools]
"github:lucasew/workspaced" = "0.1.6"

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.test]
depends = ["test:*"]

[tasks."test:build"]
run = "cmake . && make"

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:dummy"]
run = "echo 'No codegen needed'"

[tasks.install]
depends = ["install:*"]

[tasks."install:dummy"]
run = "echo 'No install needed'"

[tasks.ci]
depends = ["lint", "test"]
